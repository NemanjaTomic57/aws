AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Three EC2 instances in three public subnets behind an Application
  Load Balancer, serving a simple Hello World website.

Parameters:

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  Subnet1Cidr:
    Type: String
    Default: 10.0.1.0/24

  Subnet2Cidr:
    Type: String
    Default: 10.0.2.0/24

  Subnet3Cidr:
    Type: String
    Default: 10.0.3.0/24


Resources:

  # ============================================================
  # VPC
  # ============================================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: HelloWorld-VPC


  # ============================================================
  # Internet Gateway
  # ============================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: HelloWorld-IGW

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway


  # ============================================================
  # Public Subnets
  # ============================================================

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref Subnet1Cidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: HelloWorld-PublicSubnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref Subnet2Cidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: HelloWorld-PublicSubnet-2

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref Subnet3Cidr
      AvailabilityZone: !Select
        - 2
        - !GetAZs ""
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: HelloWorld-PublicSubnet-3


  # ============================================================
  # Route Table
  # ============================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: HelloWorld-PublicRouteTable

  DefaultInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable


  # ============================================================
  # Security Groups
  # ============================================================

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic to the Application Load Balancer
      VpcId: !Ref VPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: HelloWorld-ALB-SG


  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic only from the ALB
      VpcId: !Ref VPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          # SourceSecurityGroupId: !Ref ALBSecurityGroup
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: HelloWorld-Instance-SG


  # ============================================================
  # IAM Role for EC2
  # ============================================================

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub HelloWorld-EC2-Role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore


  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role


  # ============================================================
  # EC2 Instances
  # ============================================================

  Instance1:
    Type: AWS::EC2::Instance

    Properties:
      InstanceType: !Ref InstanceType

      ImageId: !Sub
        - "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        - {}

      SubnetId: !Ref PublicSubnet1

      SecurityGroupIds:
        - !Ref InstanceSecurityGroup

      IamInstanceProfile: !Ref EC2InstanceProfile

      Tags:
        - Key: Name
          Value: HelloWorld-Instance-1

      UserData:
        Fn::Base64: |
          #!/bin/bash

          dnf update -y
          dnf install -y nginx

          systemctl enable nginx
          systemctl start nginx

          TOKEN=$(curl -s -X PUT \
            "http://169.254.169.254/latest/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

          INSTANCE_ID=$(curl -s \
            -H "X-aws-ec2-metadata-token: $TOKEN" \
            "http://169.254.169.254/latest/meta-data/instance-id")

          cat > /usr/share/nginx/html/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">

              <title>Hello World</title>

              <style>
                  * {
                      box-sizing: border-box;
                  }

                  body {
                      margin: 0;
                      min-height: 100vh;

                      display: flex;
                      align-items: center;
                      justify-content: center;

                      font-family:
                          -apple-system,
                          BlinkMacSystemFont,
                          "Segoe UI",
                          Roboto,
                          Helvetica,
                          Arial,
                          sans-serif;

                      background:
                          radial-gradient(
                              circle at top,
                              #12345a 0%,
                              #071a2f 45%,
                              #030b16 100%
                          );

                      color: white;
                  }

                  .container {
                      text-align: center;
                      padding: 60px;
                  }

                  h1 {
                      font-size: 72px;
                      margin: 0 0 20px;

                      letter-spacing: -3px;

                      text-shadow:
                          0 10px 30px rgba(0,0,0,0.4);
                  }

                  p {
                      font-size: 24px;
                      color: #a9c7e8;
                      margin: 10px 0;
                  }

                  .instance {
                      display: inline-block;

                      margin-top: 30px;
                      padding: 14px 24px;

                      border-radius: 12px;

                      background: rgba(255,255,255,0.08);

                      border: 1px solid
                              rgba(255,255,255,0.15);

                      font-family: monospace;
                      font-size: 18px;

                      box-shadow:
                          0 10px 40px
                          rgba(0,0,0,0.3);
                  }
              </style>
          </head>

          <body>

              <div class="container">

                  <h1>Hello World</h1>

                  <p>Welcome to AWS.</p>

                  <div class="instance">
                      Instance ID: ${INSTANCE_ID}
                  </div>

              </div>

          </body>
          </html>
          EOF


