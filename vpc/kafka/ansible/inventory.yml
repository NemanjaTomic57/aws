all:
  vars:
    ansible_ssh_private_key_file: ~/.ssh/aws.pem
  children:
    kafka:
      vars:
        ansible_user: admin
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o ProxyCommand="ssh
          -i ~/.ssh/aws.pem -o StrictHostKeyChecking=no -W %h:%p ec2-user@3.66.171.28"
        kafka: /opt/kafka
        kafka_logs: '{{ kafka }}/logs'
        kafka_bin: '{{ kafka }}/bin'
        kafka_config: '{{ kafka }}/config'
        kafka_config_server: '{{ kafka_config }}/server.properties'
        kafka_cluster_uuid: 9QRITYyyS2qeAIfDgxB3OA
      hosts:
        kafka-1:
          ansible_host: 192.168.32.254
